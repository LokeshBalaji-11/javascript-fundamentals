<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Form Validation Example</title>

<style>

    .error {
        color: rgb(240, 6, 6);
        font-size: 0.9em;
    }

</style>

</head>

<body>

<h1>Registration Form</h1>

<form id="Student-registrationForm">

    <div>

        <label for="Student name">Username:</label>

        <input type="text" id="Student name" name="student name">

        <div id="StudentnameError" class="error"></div>

    </div>

    <br>

    <div>

        <label for="student email">Email:</label>

        <input type="email" id="student email" name="student email">

        <div id="studentemailError" class="error"></div>

    </div>

    <br>

    <div>

        <label for="password">Password:</label>

        <input type="password" id="password" name="password">

        <div id="passwordError" class="error"></div>

    </div>

    <br>

    <div>

        <label for="Phone Number">Phone number</label>

        <input type="number" id="Phone Number" name="PHONE number">

        <div id="phonenumberError" class="error"></div>

    </div>

    <br>

    <div>

        <label for="Address">Address</label>

        <input type="text" id="Address" name="Address">

        <div id="AdressError" class="error"></div>

    </div>

    <button type="submit">Submit</button>

</form>

<script src="validation.js"></script>

</body>

</html>
